[project]
name = "lingo-detect"
version = "0.7.0"
description = "Script-first language detection with uncertainty fallbacks"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
lingo_detect = ["profiles.json"]

[tool.setuptools]
packages = ["lingo_detect"]
